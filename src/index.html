<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PoincaréLab — visualizador interativo do plano hiperbólico no disco de Poincaré, com pontos, h-retas, h-ângulos, construções métricas e resolução de restrições geométricas.">
<title>PoincaréLab — Visualizador do Disco de Poincaré</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>PoincaréLab</h1>
<p class="subtitle">um visualizador do plano hiperbólico, no disco de Poincaré</p>

<div class="app">

  <div class="toolbar">
    <div class="tool-group-label">Construir</div>
    <button class="tool active" data-tool="point" title="Ponto">
      <span class="tool-icon">
        <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="3" fill="currentColor"/></svg>
      </span>
      Ponto
    </button>
    <button class="tool" data-tool="hline" title="H-reta por dois pontos">
      <span class="tool-icon">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 12 Q8 2 14 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
      H-reta
    </button>
    <button class="tool" data-tool="hsegment" title="H-segmento entre dois pontos">
      <span class="tool-icon">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 12 Q8 3 13 5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="3" cy="12" r="1.6" fill="currentColor"/><circle cx="13" cy="5" r="1.6" fill="currentColor"/></svg>
      </span>
      H-segmento
    </button>
    <button class="tool" data-tool="hangle" title="H-ângulo por 3 pontos (vértice no meio)">
      <span class="tool-icon">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 12 L8 4 L14 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.4 7.2 A 3 3 0 0 1 9.6 6.6" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </span>
      H-ângulo
    </button>
    <button class="tool" data-tool="htriangle" title="H-triângulo por 3 pontos">
      <span class="tool-icon">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2 Q4 6 3 13 Q9 11 13 13 Q11 6 8 2 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </span>
      H-triângulo
    </button>

    <div class="tool-group-label">Construções</div>
    <button class="tool" data-tool="midpoint" title="Ponto médio hiperbólico de um h-segmento ou h-reta">
      <span class="tool-icon">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 13 Q8 3 14 3" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8.4" cy="6.6" r="1.8" fill="currentColor"/></svg>
      </span>
      Ponto médio
    </button>
    <button class="tool" data-tool="perpfoot" title="Pé da perpendicular de um ponto a uma h-reta">
      <span class="tool-icon">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 12 L14 8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.5 9.3 L12 2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2 1.5"/><rect x="8.6" y="8.6" width="2.4" height="2.4" fill="none" stroke="currentColor" stroke-width="0.9" transform="rotate(-19 9.8 9.8)"/></svg>
      </span>
      Pé da perp.
    </button>
    <button class="tool" data-tool="reflect" title="Refletir um ponto em relação a uma h-reta">
      <span class="tool-icon">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L8 15" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2 1.5"/><circle cx="4.5" cy="6" r="1.6" fill="currentColor"/><circle cx="11.5" cy="6" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </span>
      Refletir
    </button>

    <div class="tool-group-label">Editar</div>
    <button class="tool" data-tool="move" title="Mover ponto">
      <span class="tool-icon">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 1 L2 12 L5 9.5 L7 13 L8.6 12.2 L6.8 8.6 L10.5 8.4 Z" fill="currentColor"/></svg>
      </span>
      Mover
    </button>
    <button class="tool" data-tool="delete" title="Apagar objeto">
      <span class="tool-icon">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 4h8M5.5 4V2.5h3V4M4 4l0.6 8.5h4.8L10 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Apagar
    </button>

    <div class="tool-group-label">Histórico</div>
    <div class="action-row">
      <button class="action-icon" id="undoBtn" title="Desfazer (Ctrl+Z)">↶</button>
      <button class="action-icon" id="redoBtn" title="Refazer (Ctrl+Shift+Z)">↷</button>
    </div>

    <div class="tool-group-label">Arquivo</div>
    <button class="action" id="exportBtn">Exportar (.json)</button>
    <button class="action" id="importBtn">Importar (.json)</button>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">

    <button class="action" id="clearBtn">Limpar tudo</button>
  </div>

  <div class="canvas-wrap">
    <svg id="canvas" width="520" height="520" viewBox="0 0 520 520"></svg>
    <div class="zoom-controls">
      <button id="zoomInBtn" title="Aproximar">+</button>
      <button id="zoomResetBtn" title="Redefinir zoom">⦾</button>
      <button id="zoomOutBtn" title="Afastar">−</button>
    </div>
    <div class="prop-panel" id="propPanel" style="display:none;">
      <span class="prop-close" id="propCloseBtn">×</span>
      <div class="prop-title" id="propTitle">Propriedades</div>
      <div class="prop-row">
        <span>Cor</span>
        <div class="prop-swatches" id="propSwatches"></div>
      </div>
      <div class="prop-row" id="propWidthRow">
        <span>Espessura</span>
        <input type="range" id="propWidth" min="1" max="5" step="0.5" value="2">
      </div>
      <div class="prop-row" id="propDashRow">
        <span>Traço</span>
        <select id="propDash">
          <option value="solid">Sólido</option>
          <option value="dashed">Tracejado</option>
          <option value="dotted">Pontilhado</option>
        </select>
      </div>
      <div class="prop-row">
        <span>Objeto visível</span>
        <input type="checkbox" id="propVisible" checked>
      </div>
      <div class="prop-row">
        <span>Rótulo visível</span>
        <input type="checkbox" id="propLabelVisible" checked>
      </div>
      <div class="prop-row" id="propShowValueRow">
        <span id="propShowValueLabel">Mostrar valor</span>
        <input type="checkbox" id="propShowValue" checked>
      </div>
    </div>
  </div>

  <div class="algebra">
    <div class="algebra-header">Objetos</div>
    <div class="algebra-list" id="algebraList"></div>
    <div class="command-box">
      <input type="text" id="commandInput" placeholder="ex: r = Reta(A, B)" autocomplete="off" spellcheck="false">
      <div class="command-feedback" id="commandFeedback"></div>
    </div>
  </div>

</div>

<p class="hint" id="hint">Clique dentro do disco para criar um ponto.</p>

<script src="app.js"></script>
</body>
</html>
